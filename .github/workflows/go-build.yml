name: Go Build and Test
on:
  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./backend/go.mod

      - name: Build services-o-matic
        working-directory: ./backend
        run: go build -v ./...

      - name: Run tests
        working-directory: ./backend
        run: go test -v ./...
