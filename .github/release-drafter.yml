name-template: 'v$RESOLVED_VERSION 🛍️'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🔄 Refactored'
    labels:
      - 'refactor'
  - title: '⚠️ Breaking Changes'
    labels:
      - 'breaking change'
  - title: '🧰 Maintenance'
    label: 'chore'
  - title: '⚙️ Dependencies'
    labels:
      - 'dependencies'
      - 'dependency'
      - 'deps'
  - title: '🔧 Continuous Integration'
    labels:
      - 'ci'
      - 'continuous integration'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
  - title: '✅ Testing'
    labels:
      - 'test'
      - 'testing'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch
template: |
  ## Changes

  $CHANGES