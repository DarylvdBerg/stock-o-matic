name: Pull Request Validation
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-validation:
    name: Backend Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/go-build.yml

  backend-linting:
    name: Backend Linting
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/golangci-lint.yml

  frontend-validation:
    name: Frontend Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/next-build-test.yml

  pr-status-check:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: [backend-validation, backend-linting, frontend-validation]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.backend-validation.result }}" =~ ^(success|skipped)$ ]] && \
             [[ "${{ needs.backend-linting.result }}" =~ ^(success|skipped)$ ]] && \
             [[ "${{ needs.frontend-validation.result }}" =~ ^(success|skipped)$ ]]; then
            echo "All validations passed or were skipped"
            exit 0
          else
            echo "One or more validations failed"
            exit 1
          fi
